name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  version:
    name: Select release version
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select next SemVer or validate manual tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 .github/scripts/release-version.py --tag "$REF_NAME"
          else
            python3 .github/scripts/release-version.py
          fi
  build:
    name: Build release artifacts
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require validated commit on main and prepare local tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.20.2
          install-only: true
      - name: Build Linux amd64 binary and source archive
        env:
          GOWORK: "off"
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
        run: |
          goreleaser check --config .github/goreleaser.yml
          goreleaser release --clean --skip=publish --config .github/goreleaser.yml
          cp dist/goreleaser/*.tar.gz dist/
          cp dist/goreleaser/threat-bot_linux_amd64_v1/threat-bot threat-bot
          ./threat-bot version
          go version -m threat-bot > dist/build-info.txt
          cat Dockerfile >> dist/build-info.txt
          GOBIN="$RUNNER_TEMP/tools" go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$RUNNER_TEMP/tools/govulncheck" -mode=binary threat-bot
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container without publishing credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: threat-bot:release
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            REVISION=${{ github.sha }}
      - name: Smoke test release container
        run: |
          docker run --rm --network none threat-bot:release version
          docker run --rm --network none -v "$PWD/config.example.yaml:/app/config.yaml:ro" threat-bot:release -config /app/config.yaml config validate
          docker save threat-bot:release -o dist/image.tar
      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: threat-bot:release
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: dist/container-scan.json
      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: threat-bot:release
          format: spdx-json
          syft-version: v1.57.1
          output-file: dist/image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate binary SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: threat-bot
          format: spdx-json
          syft-version: v1.57.1
          output-file: dist/binary.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum ./*.tar.gz ./*.spdx.json build-info.txt container-scan.json > checksums.txt
          sha256sum image.tar > image-transfer-checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.json
            dist/*.txt
            dist/image.tar
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish verified artifacts
    needs: [validate, version, build]
    environment: public-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist
      - name: Verify transferred artifacts
        working-directory: dist
        run: |
          sha256sum --check checksums.txt
          sha256sum --check image-transfer-checksums.txt
      - name: Reject existing release or image
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          VERSION: ${{ needs.version.outputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          # Trusted workflow code only: never execute scripts from build artifacts
          # or check out application source in this privileged job.
          def stop(message):
              raise SystemExit("Release guard: " + message)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, target):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def request_json(url, authorization, label, allow_absent=False, accept="application/vnd.github+json"):
              request = urllib.request.Request(url, headers={
                  "Authorization": authorization,
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "threat-bot-release-guard",
              })
              try:
                  response = opener.open(request, timeout=20)
              except urllib.error.HTTPError as error:
                  if error.code != 404 or not allow_absent:
                      stop(label + " could not be verified (HTTP " + str(error.code) + ")")
                  response = error
              except OSError:
                  stop(label + " could not be verified (network failure)")
              with response:
                  status = response.status
                  body = response.read(65537)
              if status not in (200, 404) or len(body) > 65536:
                  stop(label + " returned an unexpected response")
              payload = json.loads(body)
              if not isinstance(payload, dict):
                  stop(label + " returned an unexpected response")
              return status, payload

          def confirmed_absent(status, payload, label, missing_messages=("Not Found",)):
              if status == 200:
                  stop(label + " already exists; use a new version, never overwrite a release")
              if status != 404 or payload.get("message") not in missing_messages:
                  stop(label + " absence could not be confirmed")

          def guard():
              repository = os.environ["REPOSITORY"]
              version = os.environ["VERSION"]
              token = os.environ["GH_TOKEN"]
              actor = os.environ["ACTOR"]
              repository_id = int(os.environ["REPOSITORY_ID"])
              if not token or not actor or repository_id <= 0:
                  stop("required release identity or credentials are missing")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
                  stop("invalid repository identity")
              if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
                  stop("invalid release version")
              github_auth = "Bearer " + token
              repo_url = "https://api.github.com/repos/" + repository
              _, repo = request_json(repo_url, github_auth, "repository access")
              if repo.get("id") != repository_id or repo.get("full_name", "").lower() != repository.lower():
                  stop("repository identity does not match the workflow repository")
              owner, package_name = repository.split("/")
              repo_owner = repo.get("owner") or {}
              if repo_owner.get("login", "").lower() != owner.lower():
                  stop("repository owner could not be verified")
              owner_type = repo_owner.get("type")
              if owner_type not in ("Organization", "User"):
                  stop("repository owner type could not be verified")

              # A resource 404 is accepted only after authenticated repository
              # access/identity succeeds. Auth failures and redirects never mean absent.
              status, release = request_json(repo_url + "/releases/tags/" + version, github_auth, "version release", True)
              confirmed_absent(status, release, "version release")
              owner_route = "orgs" if owner_type == "Organization" else "users"
              package_url = "https://api.github.com/" + owner_route + "/" + owner + "/packages/container/" + package_name.lower()
              status, package = request_json(package_url, github_auth, "package ownership", True)
              if status == 404:
                  confirmed_absent(status, package, "package", ("Not Found", "Package not found."))
              else:
                  linked_repo = package.get("repository") or {}
                  if package.get("package_type") != "container" or package.get("name") != package_name.lower() or linked_repo.get("id") != repository_id:
                      stop("existing package is not verifiably linked to this repository; reconcile namespace ownership before releasing")

              image = repository.lower()
              basic = base64.b64encode((actor + ":" + token).encode()).decode()
              # Request the same scope needed for first publication, but perform
              # only read requests. Missing/private namespaces must not turn an
              # authorization failure into a false absence result.
              query = urllib.parse.urlencode({"service": "ghcr.io", "scope": "repository:" + image + ":pull,push"})
              _, credentials = request_json("https://ghcr.io/token?" + query, "Basic " + basic, "registry authorization")
              registry_token = credentials.get("token") or credentials.get("access_token")
              if not isinstance(registry_token, str) or not registry_token:
                  stop("registry authorization did not return a token")
              accepts = "application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"
              status, manifest = request_json("https://ghcr.io/v2/" + image + "/manifests/" + version, "Bearer " + registry_token, "version image", True, accepts)
              if status == 200:
                  stop("version image already exists; use a new version, never overwrite an image")
              errors = manifest.get("errors")
              if status != 404 or not isinstance(errors, list) or not errors or any(not isinstance(error, dict) or error.get("code") not in ("MANIFEST_UNKNOWN", "NAME_UNKNOWN") for error in errors):
                  stop("version image absence could not be confirmed")
              print("Release and image version are absent; repository/package ownership checks passed")

          try:
              guard()
          except Exception:
              # Never render remote bodies, token replies or credential-bearing errors.
              stop("remote state could not be verified")
          PY
      - name: Ensure release tag points to validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.tag }}
          REVISION: ${{ github.sha }}
        run: |
          ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq ".[] | select(.ref == \"refs/tags/$VERSION\") | .ref")
          if [ -z "$ref" ]; then
            gh api "repos/$GH_REPO/git/refs" --method POST -f "ref=refs/tags/$VERSION" -f "sha=$REVISION" > /dev/null
          fi
          test "$(gh api "repos/$GH_REPO/commits/$VERSION" --jq .sha)" = "$REVISION"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker load -i dist/image.tar
          docker tag threat-bot:release "$image:$VERSION"
          docker push "$image:$VERSION"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$VERSION" | cut -d@ -f2)"
          test -n "$digest"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$image" "$digest" > dist/image-digest.txt
      - name: Record published image identity
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.tag }}
          REVISION: ${{ github.sha }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Invalid published image digest")
          record = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "version": os.environ["VERSION"],
              "revision": os.environ["REVISION"],
              "image": os.environ["IMAGE"] + "@" + digest,
              "image_digest": digest,
              "platform": "linux/amd64",
              "workflow": ".github/workflows/release.yml",
          }
          Path("dist/release-record.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
          (cd dist && sha256sum image-digest.txt release-record.json >> checksums.txt)
      - name: Attest release files
        id: release_files_attest_first
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/build-info.txt
            dist/container-scan.json
            dist/checksums.txt
            dist/image-digest.txt
            dist/release-record.json
      - name: Wait before retrying release-file attestation
        if: steps.release_files_attest_first.outcome == 'failure'
        run: sleep 15
      - name: Retry release-file attestation once
        id: release_files_attest_retry
        if: steps.release_files_attest_first.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/build-info.txt
            dist/container-scan.json
            dist/checksums.txt
            dist/image-digest.txt
            dist/release-record.json
      - name: Require release-file attestation
        if: steps.release_files_attest_first.outcome != 'success' && steps.release_files_attest_retry.outcome != 'success'
        run: |
          echo "Release-file attestation failed twice; release creation is blocked." >&2
          exit 1
      - name: Attest container provenance (attempt 1)
        id: container_attest_first
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Wait before retrying container provenance attestation
        if: steps.container_attest_first.outcome == 'failure'
        run: sleep 15
      - name: Retry container provenance attestation once
        id: container_attest_retry
        if: steps.container_attest_first.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Require container provenance attestation
        if: steps.container_attest_first.outcome == 'failure' && steps.container_attest_retry.outcome == 'failure'
        run: |
          echo "Container provenance attestation failed twice; release creation is blocked." >&2
          exit 1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes dist/*.tar.gz dist/*.spdx.json dist/build-info.txt dist/checksums.txt dist/image-digest.txt dist/release-record.json dist/container-scan.json
